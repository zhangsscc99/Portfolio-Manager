<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Server Router · openfolio.uk</title>
<style>
  :root { --bg:#0d1117; --card:#161b22; --border:#30363d; --text:#e6edf3; --muted:#8b949e; --accent:#58a6ff; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--text); font-family:-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,"PingFang SC","Microsoft YaHei",sans-serif; min-height:100vh; padding:40px 20px; }
  .wrap { max-width:960px; margin:0 auto; }
  h1 { font-size:26px; font-weight:700; margin-bottom:6px; }
  h1 span { color:var(--accent); }
  .sub { color:var(--muted); font-size:14px; margin-bottom:28px; }
  h2 { font-size:18px; margin:30px 0 14px; padding-bottom:8px; border-bottom:1px solid var(--border); }
  h2:first-of-type { margin-top:0; }
  h2 .n { color:var(--muted); font-weight:400; font-size:14px; margin-left:8px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:14px; }
  a.card { display:block; background:var(--card); border:1px solid var(--border); border-radius:10px; padding:16px 18px; text-decoration:none; color:var(--text); transition:border-color .15s, transform .15s; }
  a.card:hover { border-color:var(--accent); transform:translateY(-2px); }
  .card .name { font-size:16px; font-weight:600; color:var(--accent); margin-bottom:4px; }
  .card .url { font-size:12.5px; color:var(--muted); word-break:break-all; margin-bottom:6px; }
  .card .desc { font-size:13px; color:var(--text); opacity:.85; }
  .tag { display:inline-block; font-size:11px; border:1px solid var(--border); border-radius:20px; padding:1px 8px; color:var(--muted); margin-top:8px; }
  footer { margin-top:36px; color:var(--muted); font-size:12px; text-align:center; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🧭 Server <span>Router</span></h1>
  <div class="sub">openfolio.uk · 全部服务入口 · 点击在新标签页打开</div>
  <div id="sections"></div>
  <footer>generated by hermes · edit /root/Portfolio-Manager/router.html</footer>
</div>
<script>
const sections = [
  { title: "🖥️ 前端页面", items: [
    { name:"Portfolio 主站", url:"https://openfolio.uk", desc:"openfolio.uk 门户 / Portfolio-Manager" },
    { name:"DatingAgent", url:"http://103.146.124.206:3012", desc:"AI 约会助手（Express + React）" },
    { name:"jinshu 前端", url:"http://103.146.124.206:5210", desc:"锦书情辞 · 情感表达助手" },
    { name:"Grafana 监控", url:"https://openfolio.uk/health", desc:"Prometheus + Grafana 服务器监控面板" },
    { name:"AI-Notebook", url:"http://103.146.124.206:8765", desc:"AI 笔记本应用" },
    { name:"Mistake-Notebook 前端", url:"http://103.146.124.206:8081", desc:"错题本前端" },
    { name:"Hermes Dashboard", url:"http://103.146.124.206:9119", desc:"Hermes web 管理面板" },
  ]},
  { title: "⚙️ 后端与 API", items: [
    { name:"Portfolio API", url:"http://103.146.124.206:5010", desc:"Portfolio 后端接口" },
    { name:"jinshu 后端 API", url:"http://103.146.124.206:8090", desc:"Spring Boot 接口服务" },
    { name:"Mistake-Notebook API", url:"http://103.146.124.206:8080", desc:"错题本后端（Java）" },
    { name:"LiteLLM Proxy", url:"http://103.146.124.206:4000", desc:"OpenAI 兼容 LLM 代理" },
    { name:"Embedding Server", url:"http://103.146.124.206:8008", desc:"文本向量化服务" },
  ]},
  { title: "🛠️ 终端与工具", items: [
    { name:"服务导航", url:"https://openfolio.uk/router", desc:"当前页面" },
  ]},
];
document.getElementById('sections').innerHTML = sections.map(s =>
  `<h2>${s.title}<span class="n">${s.items.length} 个</span></h2>
   <div class="grid">${s.items.map(i =>
     `<a class="card" href="${i.url}" target="_blank" rel="noopener noreferrer">
        <div class="name">${i.name}</div>
        <div class="url">${i.url}</div>
        <div class="desc">${i.desc}</div>
        <span class="tag">新标签页</span>
      </a>`).join('')}</div>`).join('');
</script>
</body>
</html>
